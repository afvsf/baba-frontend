<!DOCTYPE html>
<html lang="pt-BR">
<head>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#22c55e">

<link rel="apple-touch-icon" href="icon-192.png">

  
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Admin</title>

<style>

*{
  box-sizing:border-box;
}

body{
  font-family:Arial, sans-serif;
  background:#0f172a;
  color:#fff;
  margin:0;
  padding:15px;
}

h2{
  text-align:center;
  margin-bottom:20px;
  font-size:32px;
}

.btn{
  display:inline-block;
  padding:12px 18px;
  background:#3b82f6;
  margin:5px;
  border-radius:10px;
  color:#fff;
  text-decoration:none;
  font-weight:bold;
}

.card{
  background:#1e293b;
  padding:20px;
  border-radius:15px;
  margin-bottom:15px;
  box-shadow:0 4px 12px rgba(0,0,0,.35);
}

/* ==========================
   DASHBOARD KPI
========================== */

.dashboard-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
  margin-bottom:20px;
}

.kpi{
  text-align:center;
  min-height:180px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.kpi span{
  font-size:clamp(16px,2vw,22px);
  color:#cbd5e1;
  font-weight:bold;
}

.kpi h2{
  margin:10px 0 0;
  font-size:clamp(42px,5vw,72px);
  line-height:1;
  color:#22c55e;
  font-weight:bold;
  word-break:break-word;
}

/* ==========================
   TÍTULOS DOS RANKINGS
========================== */

h3{
  margin:0 0 15px;
  font-size:28px;
}

/* ==========================
   RANKINGS
========================== */

.ranking-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;

  background:#0f172a;
  border-radius:12px;
  padding:14px 18px;
  margin-bottom:8px;

  font-size:18px;
  font-weight:bold;
}

.ranking-item:nth-child(1){
  background:#14532d;
}

.ranking-item:nth-child(2){
  background:#334155;
}

.ranking-item:nth-child(3){
  background:#475569;
}

.ranking-item span:first-child{
  flex:1;
}

.ranking-item span:last-child{
  color:#22c55e;
  white-space:nowrap;
}

/* ==========================
   MOBILE
========================== */

@media(max-width:768px){

  body{
    padding:10px;
  }

  h2{
    font-size:24px;
  }

  .dashboard-grid{
    grid-template-columns:1fr;
  }

  .kpi{
    min-height:150px;
  }

  .kpi span{
    font-size:18px;
  }

  .kpi h2{
    font-size:56px;
  }

  h3{
    font-size:22px;
  }

  .ranking-item{
    flex-direction:column;
    align-items:flex-start;
    font-size:17px;
    padding:12px;
  }

  .ranking-item span:last-child{
    margin-top:5px;
  }

  .btn{
    display:block;
    width:100%;
    margin:6px 0;
    text-align:center;
  }

}

</style>

</head>

<body>

<h2 style="text-align:center;">⚙️ Painel Administrativo</h2>

<div style="text-align:center;">
  <a href="cadastro_jogador.html" class="btn">👤 Jogadores</a>
  <a href="financeiro.html" class="btn">💰 Financeiro</a>
  <a href="baba.html" class="btn">📅 Baba</a>
  <a href="mes.html" class="btn">💰 Mensalidades</a>
  <button onclick="logout()" class="btn" style="background:#ef4444;">Sair</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard">

  <div class="dashboard-grid">

    <div class="card kpi">
      <span>👥 Jogadores</span>
      <h2 id="totalJogadores">0</h2>
    </div>

    <div class="card kpi">
      <span>💰 Arrecadado Mês</span>
      <h2 id="totalMensalidades">R$ 0</h2>
    </div>

    <div class="card kpi">
      <span>🟢 Mensalistas</span>
      <h2 id="totalMensalistas">0</h2>
    </div>

    <div class="card kpi">
      <span>🎟️ Avulsos</span>
      <h2 id="totalAvulsos">0</h2>
    </div>

    <div class="card kpi">
      <span>⚽ Total Gols</span>
      <h2 id="totalGols">0</h2>
    </div>

    <div class="card kpi">
      <span>📅 Presenças</span>
      <h2 id="totalPresencas">0</h2>
    </div>

  </div>


  <div class="card">
    <h3>🏆 Ranking de Gols</h3>
    <div id="rankingGols"></div>
  </div>

  <div class="card">
    <h3>📅 Ranking de Presença</h3>
    <div id="rankingPresenca"></div>
  </div>

  <div class="card">
    <h3>🟨 Jogadores Mais Disciplinados</h3>
    <div id="rankingDisciplina"></div>
  </div>

  <div class="card">
    <h3>🚨 Mais Cartões</h3>
    <div id="rankingCartoes"></div>
  </div>

</div>

<script>
const API = 'https://baba-backend-production.up.railway.app';

function api(url, options = {}){
  const token = localStorage.getItem('token');

  if(!token){
    window.location.href = 'login.html';
  }

  return fetch(API + url, {
    ...options,
    headers: {
      'Content-Type':'application/json',
      'Authorization': 'Bearer ' + token
    }
  });
}

function logout(){
  localStorage.removeItem('token');
  window.location.href = 'index.html';
}

async function carregar(){

  const jogadores =
    await api('/jogadores')
    .then(r=>r.json());

  const registros =
    await api('/registros')
    .then(r=>r.json());

  const mensalidades =
    await api('/mensalidades')
    .then(r=>r.json());

  const hoje = new Date();

  const mesAtual =
    `${hoje.getFullYear()}-${String(
      hoje.getMonth()+1
    ).padStart(2,'0')}`;

  // RESUMOS
  const mensalistas =
    jogadores.filter(j =>
      j.tipo === 'mensal' ||
      j.tipo === 'mensalista'
    );

  const avulsos =
    jogadores.filter(j =>
      j.tipo === 'avulso'
    );

  const arrecadado =
    mensalidades
      .filter(m => m.mes === mesAtual)
      .reduce((s,m)=>
        s + Number(m.valor || 0)
      ,0);

  const totalGols =
    registros.reduce((s,r)=>
      s + Number(r.gols || 0)
    ,0);

  document.getElementById(
    'totalJogadores'
  ).innerHTML = jogadores.length;

  document.getElementById(
    'totalMensalistas'
  ).innerHTML = mensalistas.length;

  document.getElementById(
    'totalAvulsos'
  ).innerHTML = avulsos.length;

  document.getElementById(
    'totalMensalidades'
  ).innerHTML =
    'R$ ' + arrecadado.toFixed(2);

  document.getElementById(
    'totalGols'
  ).innerHTML = totalGols;

  document.getElementById(
    'totalPresencas'
  ).innerHTML =
    registros.length;

  montarRanking(
    jogadores,
    registros
  );
}

function montarRanking(
  jogadores,
  registros
){

  const gols = {};
  const presencas = {};
  const cartoes = {};

  jogadores.forEach(j=>{

    gols[j.id] = 0;
    presencas[j.id] = 0;
    cartoes[j.id] = 0;

  });

  registros.forEach(r=>{

    const id =
      r.jogadorid ||
      r.jogadorId;

    gols[id] =
      (gols[id] || 0) +
      Number(r.gols || 0);

    presencas[id] =
      (presencas[id] || 0) + 1;

    cartoes[id] =
      (cartoes[id] || 0) +
      Number(r.cartao_amarelo || 0) +
      Number(r.cartao_azul || 0) +
      Number(r.cartao_vermelho || 0);

  });

  // GOLS
  document.getElementById(
    'rankingGols'
  ).innerHTML =
    gerarLista(
      jogadores,
      gols,
      '⚽'
    );

  // PRESENÇA
  document.getElementById(
    'rankingPresenca'
  ).innerHTML =
    gerarLista(
      jogadores,
      presencas,
      '📅'
    );

  // DISCIPLINA
  document.getElementById(
    'rankingDisciplina'
  ).innerHTML =
    gerarListaMenor(
      jogadores,
      cartoes,
      '🟨'
    );

  // CARTÕES
  document.getElementById(
    'rankingCartoes'
  ).innerHTML =
    gerarLista(
      jogadores,
      cartoes,
      '🚨'
    );
}

function gerarLista(jogadores,dados,emoji){

  return Object.entries(dados)

    .sort((a,b)=>b[1]-a[1])

    .slice(0,5)

    .map((x,i)=>{

      const j = jogadores.find(
        p => String(p.id) === String(x[0])
      );

      const medalha =
        i===0 ? '🥇' :
        i===1 ? '🥈' :
        i===2 ? '🥉' :
        `${i+1}º`;

      return `
        <div class="ranking-item">
          <span>${medalha} ${j?.apelido || j?.nome}</span>
          <span>${emoji} ${x[1]}</span>
        </div>
      `;

    })

    .join('');
}

function gerarListaMenor(jogadores,dados,emoji){

  return Object.entries(dados)

    .sort((a,b)=>a[1]-b[1])

    .slice(0,5)

    .map((x,i)=>{

      const j = jogadores.find(
        p => String(p.id) === String(x[0])
      );

      const medalha =
        i===0 ? '🥇' :
        i===1 ? '🥈' :
        i===2 ? '🥉' :
        `${i+1}º`;

      return `
        <div class="ranking-item">
          <span>${medalha} ${j?.apelido || j?.nome}</span>
          <span>${emoji} ${x[1]}</span>
        </div>
      `;

    })

    .join('');
}

carregar();
</script>


<script>
if('serviceWorker' in navigator){

  navigator.serviceWorker
  .register('./service-worker.js')

  .then(() => {
    console.log('PWA ativo');
  });

}
</script>
  
</body>
</html>
